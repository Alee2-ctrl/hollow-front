function updEnemies(){const p=player;

  const dx=p.x-e.x,dy=p.y-e.y,adx=Math.abs(dx),dir=Math.sign(dx)||1,tgt=!p.dead;
  if(e.type==='zombie'){
   if(e.st==='rise'){e.rt++;if(e.rt%5===0)part('dust',e.x+rand(-14,14),e.y,rand(-1,1),rand(-2,-0.5));if(e.rt>=60)e.st='walk';e.face=dir;continue;}
   if(e.at>0){e.at--;e.vx*=0.8;if(e.at===10&&tgt&&adx<46&&Math.abs(dy)<50)hurtP(14);}
   else{e.face=dir;e.vx+=((tgt?dir*e.spd:0)-e.vx)*0.1;if(tgt&&adx<34&&Math.abs(dy)<40&&e.cd<=0){e.at=24;e.cd=70;}if(Math.random()<0.002)sfx('groan',0.6);}
   phys(e);
  }else if(e.type==='crawler'){
   e.face=dir;if(e.onG){if(tgt&&adx<170&&adx>50&&e.cd<=0){e.vy=-6.5;e.vx=dir*5;e.cd=80;sfx('screech',0.3);}else e.vx+=(dir*2.3-e.vx)*0.15;}
   phys(e);touchP(e,10);
  }else if(e.type==='spitter'){
   e.face=dir;let want=0;if(adx>330)want=dir*0.7;else if(adx<180)want=-dir*0.7;
   if(e.plat){const nx=e.x+want*6;if(nx<e.plat.x+10||nx>e.plat.x+e.plat.w-10)want=0;}
   if(e.at>0){e.at--;want=0;if(e.at===12&&tgt){const t=48,g=0.22,ox=e.x+e.face*14,oy=e.y-50,tx=p.x,ty=p.y-20;eb.push({x:ox,y:oy,vx:(tx-ox)/t,vy:(ty-oy-0.5*g*t*t)/t,g,r:6,dmg:14,life:220});sfx('spit',0.1);}}

   e.vx+=(want-e.vx)*0.1;phys(e);

   if(!e.mode)e.mode='hover';

    if(e.cd<=0&&tgt&&adx<320){e.mode='dive';e.dt=50;const a=Math.atan2(p.y-26-(e.y-13),dx);e.vx=Math.cos(a)*6.5;e.vy=Math.sin(a)*6.5;sfx('screech',0.3);}}
   else{e.dt--;if(e.dt<20)e.vy-=0.3;if(e.dt<=0){e.mode='hover';e.cd=rand(90,160);}}
   e.x+=e.vx;e.y+=e.vy;e.face=e.vx>=0?1:-1;const gy=groundY(e.x);if(e.y>gy){e.y=gy;e.vy=-2;}touchP(e,10);
   if(frame%5===0)part('ecto',e.x,e.y-12,0,0);

function drawRotate(){ctx.save();ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#c41212';ctx.font=`60px ${TF}`;ctx.fillText('ROTATE YOUR PHONE',W/2,H/2-20);ctx.fillStyle='#ddd';ctx.font=`14px ${HF}`;ctx.fillText('THIS GAME PLAYS IN LANDSCAPE',W/2,H/2+40);ctx.restore();}
function render(){ctx.setTransform(RS,0,0,RS,0,0);lights=[];emis=[];eyes=[];
 let sx=0,sy=0;if(shake>0.5&&!paused){sx=rand(-shake,shake);sy=rand(-shake,shake);}
 drawSky();ctx.save();ctx.translate(sx*0.3,sy*0.3);drawFar();drawTrees();drawFog(0.5,0.35,400);ctx.restore();
 ctx.save();ctx.translate(sx,sy);drawWorld();ctx.restore();
 drawLight(sx,sy);ctx.save();ctx.translate(sx,sy);drawEmissive();ctx.restore();drawRain();
 if(flashA>0){ctx.fillStyle=`rgba(200,210,255,${flashA*0.3})`;ctx.fillRect(0,0,W,H);}
 if(hurtFlash>0){ctx.fillStyle=`rgba(170,0,0,${hurtFlash/12*0.35})`;ctx.fillRect(0,0,W,H);}
 const vg=ctx.createRadialGradient(W/2,H/2,H*0.4,W/2,H/2,W*0.65);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.75)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 if(player&&player.hp<30&&!player.dead&&state==='play'){ctx.fillStyle=`rgba(150,0,0,${0.15+Math.sin(frame*0.1)*0.1})`;ctx.fillRect(0,0,W,H);}
 if(state==='title')drawTitle();else{drawHUD();if(state==='over'||state==='win')drawEnd();}
 if(touchMode&&state==='play'&&!paused)drawTouch();
 if(touchMode&&innerHeight>innerWidth)drawRotate();}

// ================= LOOP =================
function tick(){frame++;readInput();music();const press=anyPress||inp.startP;anyPress=false;
 lightning--;if(lightning<=0){flashA=1;lightning=rand(500,1100);sfx('thunder',1);}if(lightning===470)flashA=0.7;if(flashA>0)flashA=Math.max(0,flashA-0.04);
 if(shake>0){shake*=0.86;if(shake<0.5)shake=0;}
 if(touchMode&&innerHeight>innerWidth)return;
 if(state==='title'){cam.x+=0.6;if(cam.x>6000)cam.x=0;if(press)startGame();return;}
 if(state==='over'||state==='win'){endT++;if(press&&endT>90)startGame();return;}
 if(inp.pauseP)paused=!paused;if(paused)return;
 updWorld();}
newGame();state='title';
let last=performance.now(),acc=0;
function loop(now){requestAnimationFrame(loop);let dt=now-last;last=now;if(dt>100)dt=100;acc+=dt;let n=0;while(acc>=1000/60&&n<4){tick();acc-=1000/60;n++;}if(n>=4)acc=0;try{render();}catch(e){console.error(e);}}
requestAnimationFrame(loop);
window.__game={get state(){return state},get player(){return player},get cam(){return cam},get boss(){return boss},get enemies(){return enemies},startGame,keys,touch};
</script></body></html>
